name = "shuddhi-qa"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
# auto-trailing-slash: requests for /app serve app.html; /app.html redirects 307 to /app
# This prevents redirect loops with _redirects rules
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
