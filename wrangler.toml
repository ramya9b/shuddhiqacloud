name = "shuddhi-qa"
compatibility_date = "2026-04-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
# drop-extension: /app → serves app.html, /app.html → 301 to /app
# This prevents redirect loops with _redirects rules
html_handling = "drop-extension"
not_found_handling = "404-page"
